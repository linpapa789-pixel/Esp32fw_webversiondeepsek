name: PlatformIO Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run

      - name: Build LittleFS filesystem image
        run: pio run --target buildfs

      - name: Collect all .bin files
        run: |
          mkdir -p flash_package
          cp .pio/build/*/bootloader.bin flash_package/ 2>/dev/null || true
          cp .pio/build/*/partitions.bin flash_package/ 2>/dev/null || true
          cp .pio/build/*/firmware.bin flash_package/ 2>/dev/null || true
          cp .pio/build/*/littlefs.bin flash_package/ 2>/dev/null || true

      - name: Upload flash package
        uses: actions/upload-artifact@v4
        with:
          name: flash_package
          path: flash_package/
